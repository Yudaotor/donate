    --accent-soft: #f1ddc8;
    --border: rgba(43, 35, 32, 0.08);
    --shadow: rgba(43, 35, 32, 0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1714;
      --card-bg: #262019;
      --ink: #f3ece3;
      --ink-soft: #b8aa9c;
      --accent: #e2a465;
      --accent-soft: #3a2d20;
      --border: rgba(255, 255, 255, 0.08);
      --shadow: rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1714;
    --card-bg: #262019;
    --ink: #f3ece3;
    --ink-soft: #b8aa9c;
    --accent: #e2a465;
    --accent-soft: #3a2d20;
    --border: rgba(255, 255, 255, 0.08);
    --shadow: rgba(0, 0, 0, 0.35);
  }
  :root[data-theme="light"] {
    --bg: #faf6f0;
    --card-bg: #ffffff;
    --ink: #2b2320;
    --ink-soft: #6b5f56;
    --accent: #c47a3a;
    --accent-soft: #f1ddc8;
    --border: rgba(43, 35, 32, 0.08);
    --shadow: rgba(43, 35, 32, 0.10);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
  }
  main {
    width: 100%;
    max-width: 640px;
  }
  .hero {
    text-align: center;
    margin-bottom: 36px;
  }
  .hero .cup {
    font-size: 44px;
    line-height: 1;
    margin-bottom: 14px;
  }
  h1 {
    font-size: clamp(24px, 4vw, 30px);
    font-weight: 650;
    margin: 0 0 10px;
    text-wrap: balance;
  }
  .hero p {
    color: var(--ink-soft);
    font-size: 16px;
    line-height: 1.6;
    margin: 0 auto;
    max-width: 480px;
    text-wrap: balance;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  .cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  @media (max-width: 520px) {
    .cards { grid-template-columns: 1fr; }
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 22px 22px 26px;
    box-shadow: 0 10px 30px var(--shadow);
    text-align: center;
  }
  .card .label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 5px 12px;
    border-radius: 999px;
    margin-bottom: 16px;
  }
  .card img {
    width: 100%;
    max-width: 220px;
    border-radius: 12px;
    display: block;
    margin: 0 auto;
  }
  .card .hint {
    margin-top: 14px;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .card.wide {
    grid-column: 1 / -1;
  }
  .sponsor-btn {
    display: flex;
    width: fit-content;
    min-width: 240px;
    margin: 0 auto;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 16px;
    font-weight: 650;
    color: #fff;
    text-decoration: none;
    background: #bf3989;
    border-radius: 16px;
    padding: 14px 28px;
    box-shadow: 0 10px 24px rgba(191, 57, 137, 0.30);
    transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
  }
  .sponsor-btn:hover {
    filter: brightness(1.08);
    transform: translateY(-1px);
    box-shadow: 0 14px 28px rgba(191, 57, 137, 0.38);
  }
  .sponsor-btn:active { transform: translateY(0); }
  .sponsor-btn:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 3px; }
  .sponsor-btn .heart { color: #fff; }
  .sponsor-btn .go { opacity: 0.85; }
  .pay-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    align-items: start;
    margin-top: 20px;
  }
  @media (max-width: 520px) {
    .pay-grid { grid-template-columns: 1fr; }
  }
  .pay.alipay { --brand: #1677ff; --brand-shadow: rgba(22, 119, 255, 0.28); }
  .pay.wechat { --brand: #07c160; --brand-shadow: rgba(7, 193, 96, 0.28); }
  .pay > summary {
    list-style: none;
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 16px 20px;
    border-radius: 16px;
    background: var(--brand);
    color: #fff;
    font-size: 16px;
    font-weight: 650;
    box-shadow: 0 10px 24px var(--brand-shadow);
  }
  .pay > summary::-webkit-details-marker { display: none; }
  .pay > summary:hover { filter: brightness(1.06); }
  .pay > summary:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 3px; }
  .pay .chev { transition: transform 0.2s ease; }
  .pay[open] .chev { transform: rotate(180deg); }
  .pay .card { margin-top: 12px; }
  footer {
    margin-top: 40px;
    text-align: center;
    font-size: 13px;
    color: var(--ink-soft);
  }
  footer a {
    color: var(--ink-soft);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  footer a:hover { color: var(--accent); }

    </details>
    <details class="pay wechat" id="wechat">

      </div>

  </div>
  <footer>
    <a href="https://github.com/Yudaotor">github.com/Yudaotor</a>

</main>

  // ?lang= 先认(ja、pt-BR、zh-Hans 这类写法,大小写不限),认不出就按浏览器语言列表挨个找。
  function match(raw) {
    var l = String(raw || "").toLowerCase().replace(/_/g, "-");
    if (l.indexOf("zh") === 0) {
      if (/hans/.test(l)) return "zh-Hans";
      return /hant|-tw|-hk|-mo/.test(l) ? "zh-Hant" : "zh-Hans";
    }
    if (l.indexOf("pt") === 0) return "pt-BR";
    var two = l.slice(0, 2);
    if (l.length > 2 && l.charAt(2) !== "-") return null;
    return Object.prototype.hasOwnProperty.call(T, two) ? two : null;
  }
  function pick() {
    var forced = new URLSearchParams(location.search).get("lang");
    var list = navigator.languages && navigator.languages.length ? navigator.languages.slice() : [navigator.language || ""];
    if (forced) list.unshift(forced);
    for (var i = 0; i < list.length; i++) {
      var hit = match(list[i]);
      if (hit) return hit;
    }
    return "en";
  }
  var lang = pick(), t = T[lang];
  document.documentElement.lang = lang;
  document.title = t.pageTitle;
  var meta = document.querySelector('meta[name="description"]');
  if (meta) meta.setAttribute("content", t.description);
  document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = t[el.getAttribute("data-i18n")]; });
  document.querySelectorAll("[data-i18n-alt]").forEach(function (el) { el.alt = t[el.getAttribute("data-i18n-alt")]; });
