<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>请作者喝杯咖啡 ☕</title>
<meta name="description" content="如果这个小项目对你有帮助，欢迎请作者喝杯咖啡。">
<style>
  :root {
    --bg: #faf6f0;
    --card-bg: #ffffff;
    --ink: #2b2320;
    --ink-soft: #6b5f56;
    --accent: #c47a3a;
    --accent-soft: #f1ddc8;
    --border: rgba(43, 35, 32, 0.08);
    --shadow: rgba(43, 35, 32, 0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1714;
      --card-bg: #262019;
      --ink: #f3ece3;
      --ink-soft: #b8aa9c;
      --accent: #e2a465;
      --accent-soft: #3a2d20;
      --border: rgba(255, 255, 255, 0.08);
      --shadow: rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1714;
    --card-bg: #262019;
    --ink: #f3ece3;
    --ink-soft: #b8aa9c;
    --accent: #e2a465;
    --accent-soft: #3a2d20;
    --border: rgba(255, 255, 255, 0.08);
    --shadow: rgba(0, 0, 0, 0.35);
  }
  :root[data-theme="light"] {
    --bg: #faf6f0;
    --card-bg: #ffffff;
    --ink: #2b2320;
    --ink-soft: #6b5f56;
    --accent: #c47a3a;
    --accent-soft: #f1ddc8;
    --border: rgba(43, 35, 32, 0.08);
    --shadow: rgba(43, 35, 32, 0.10);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
  }
  main {
    width: 100%;
    max-width: 640px;
  }
  .hero {
    text-align: center;
    margin-bottom: 36px;
  }
  .hero .cup {
    font-size: 44px;
    line-height: 1;
    margin-bottom: 14px;
  }
  h1 {
    font-size: clamp(24px, 4vw, 30px);
    font-weight: 650;
    margin: 0 0 10px;
    text-wrap: balance;
  }
  .hero p {
    color: var(--ink-soft);
    font-size: 16px;
    line-height: 1.6;
    margin: 0 auto;
    max-width: 480px;
    text-wrap: balance;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  .cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  @media (max-width: 520px) {
    .cards { grid-template-columns: 1fr; }
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 22px 22px 26px;
    box-shadow: 0 10px 30px var(--shadow);
    text-align: center;
  }
  .card .label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 5px 12px;
    border-radius: 999px;
    margin-bottom: 16px;
  }
  .card img {
    width: 100%;
    max-width: 220px;
    border-radius: 12px;
    display: block;
    margin: 0 auto;
  }
  .card .hint {
    margin-top: 14px;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .card.wide {
    grid-column: 1 / -1;
  }
  .sponsor-btn {
    display: flex;
    width: fit-content;
    min-width: 240px;
    margin: 0 auto;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 16px;
    font-weight: 650;
    color: #fff;
    text-decoration: none;
    background: #bf3989;
    border-radius: 16px;
    padding: 14px 28px;
    box-shadow: 0 10px 24px rgba(191, 57, 137, 0.30);
    transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
  }
  .sponsor-btn:hover {
    filter: brightness(1.08);
    transform: translateY(-1px);
    box-shadow: 0 14px 28px rgba(191, 57, 137, 0.38);
  }
  .sponsor-btn:active { transform: translateY(0); }
  .sponsor-btn:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 3px; }
  .sponsor-btn .heart { color: #fff; }
  .sponsor-btn .go { opacity: 0.85; }
  .pay-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    align-items: start;
    margin-top: 20px;
  }
  @media (max-width: 520px) {
    .pay-grid { grid-template-columns: 1fr; }
  }
  .pay.alipay { --brand: #1677ff; --brand-shadow: rgba(22, 119, 255, 0.28); }
  .pay.wechat { --brand: #07c160; --brand-shadow: rgba(7, 193, 96, 0.28); }
  .pay > summary {
    list-style: none;
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 16px 20px;
    border-radius: 16px;
    background: var(--brand);
    color: #fff;
    font-size: 16px;
    font-weight: 650;
    box-shadow: 0 10px 24px var(--brand-shadow);
  }
  .pay > summary::-webkit-details-marker { display: none; }
  .pay > summary:hover { filter: brightness(1.06); }
  .pay > summary:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 3px; }
  .pay .chev { transition: transform 0.2s ease; }
  .pay[open] .chev { transform: rotate(180deg); }
  .pay .card { margin-top: 12px; }
  footer {
    margin-top: 40px;
    text-align: center;
    font-size: 13px;
    color: var(--ink-soft);
  }
  footer a {
    color: var(--ink-soft);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  footer a:hover { color: var(--accent); }
</style>
</head>
<body>
<main>
  <div class="hero">
    <div class="cup">☕</div>
    <h1 data-i18n="title">请作者喝杯咖啡</h1>
    <p data-i18n="intro">如果这个开源小项目帮到了你，欢迎请作者喝一杯</p>
  </div>
  <div class="cards">
    <div class="card wide">
      <span class="label">GitHub Sponsors</span>
      <a class="sponsor-btn" href="https://github.com/sponsors/Yudaotor"><span class="heart" aria-hidden="true">♥</span><span data-i18n="sponsor">在 GitHub 上赞助</span><svg class="go" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M4 10 10 4M5.5 4H10v4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <div class="hint" data-i18n="sponsorHint">用 GitHub 账号赞助，按月或一次性都可以</div>
    </div>
  </div>
  <div class="pay-grid">
    <details class="pay alipay" id="alipay">
      <summary><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M2 2h5v5H2zM3.5 3.5v2h2v-2zM11 2h5v5h-5zM12.5 3.5v2h2v-2zM2 11h5v5H2zM3.5 12.5v2h2v-2zM11 11h2v2h-2zM14 11h2v2h-2zM11 14h2v2h-2zM14 14h2v2h-2z"/></svg><span data-i18n="alipayToggle">支付宝扫码</span><svg class="chev" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></summary>
      <div class="card">
        <img src="assets/alipay.jpg" alt="支付宝收款码" data-i18n-alt="alipayAlt" loading="lazy">
        <div class="hint" data-i18n="alipayHint">打开支付宝扫一扫</div>
      </div>
    </details>
    <details class="pay wechat" id="wechat">
      <summary><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M2 2h5v5H2zM3.5 3.5v2h2v-2zM11 2h5v5h-5zM12.5 3.5v2h2v-2zM2 11h5v5H2zM3.5 12.5v2h2v-2zM11 11h2v2h-2zM14 11h2v2h-2zM11 14h2v2h-2zM14 14h2v2h-2z"/></svg><span data-i18n="wechatToggle">微信扫码</span><svg class="chev" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></summary>
      <div class="card">
        <img src="assets/wechat.jpg" alt="微信收款码" data-i18n-alt="wechatAlt" loading="lazy">
        <div class="hint" data-i18n="wechatHint">打开微信扫一扫</div>
      </div>
    </details>
  </div>
  <footer>
    <a href="https://github.com/Yudaotor">github.com/Yudaotor</a>
  </footer>
</main>
<script>
// 两张收款码各收在一个品牌色按钮里(<details>),点开才显示。按浏览器语言显示:中文浏览器显示简体,台湾 / 香港 / 澳门显示繁体,其它语言一律英文。?lang=en 之类可以强制。
(function () {
  var T = {
    "zh-Hans": {
      pageTitle: "请作者喝杯咖啡 ☕", description: "如果这个小项目对你有帮助，欢迎请作者喝杯咖啡。",
      title: "请作者喝杯咖啡", intro: "如果这个开源小项目帮到了你，欢迎请作者喝一杯",
      sponsor: "在 GitHub 上赞助", sponsorHint: "用 GitHub 账号赞助，按月或一次性都可以",
      alipay: "支付宝", alipayAlt: "支付宝收款码", alipayHint: "打开支付宝扫一扫",
      wechat: "微信支付", wechatAlt: "微信收款码", wechatHint: "打开微信扫一扫",
      alipayToggle: "支付宝扫码", wechatToggle: "微信扫码"
    },
    "zh-Hant": {
      pageTitle: "請作者喝杯咖啡 ☕", description: "如果這個小專案對你有幫助，歡迎請作者喝杯咖啡。",
      title: "請作者喝杯咖啡", intro: "如果這個開源小專案幫到了你，歡迎請作者喝一杯",
      sponsor: "在 GitHub 上贊助", sponsorHint: "用 GitHub 帳號贊助，按月或一次性都可以",
      alipay: "支付寶", alipayAlt: "支付寶收款碼", alipayHint: "打開支付寶掃一掃",
      wechat: "微信支付", wechatAlt: "微信收款碼", wechatHint: "打開微信掃一掃",
      alipayToggle: "支付寶掃碼", wechatToggle: "微信掃碼"
    },
    "en": {
      pageTitle: "Buy the author a coffee ☕", description: "If this little project helped you, you're welcome to buy the author a coffee.",
      title: "Buy the author a coffee", intro: "If this little open-source project helped you, you're welcome to buy the author a coffee.",
      sponsor: "Sponsor on GitHub", sponsorHint: "Sponsor with your GitHub account, monthly or one-time.",
      alipay: "Alipay", alipayAlt: "Alipay QR code", alipayHint: "Scan with Alipay",
      wechat: "WeChat Pay", wechatAlt: "WeChat Pay QR code", wechatHint: "Scan with WeChat",
      alipayToggle: "Alipay QR code", wechatToggle: "WeChat Pay QR code"
    }
  };
  function pick() {
    var forced = new URLSearchParams(location.search).get("lang");
    var list = forced ? [forced] : (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""]);
    for (var i = 0; i < list.length; i++) {
      var l = String(list[i]).toLowerCase();
      if (l.indexOf("zh") === 0) return /hant|-tw|-hk|-mo/.test(l) ? "zh-Hant" : "zh-Hans";
      if (l.indexOf("en") === 0) return "en";
    }
    return "en";
  }
  var lang = pick(), t = T[lang];
  document.documentElement.lang = lang;
  document.title = t.pageTitle;
  var meta = document.querySelector('meta[name="description"]');
  if (meta) meta.setAttribute("content", t.description);
  document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = t[el.getAttribute("data-i18n")]; });
  document.querySelectorAll("[data-i18n-alt]").forEach(function (el) { el.alt = t[el.getAttribute("data-i18n-alt")]; });
})();
// 带着 #alipay / #wechat 进来(仓库 Sponsor 按钮、主页 README 的链接)时展开对应那张收款码。
(function () {
  function openFromHash() {
    var d = document.getElementById(location.hash.slice(1));
    if (d && d.tagName === "DETAILS") {
      d.open = true;
      d.scrollIntoView({ block: "center" });
    }
  }
  openFromHash();
  window.addEventListener("hashchange", openFromHash);
})();
</script>
</body>
</html>
